<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111c"/>
      <stop offset="1" stop-color="#060a10"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ba3ff"/>
      <stop offset="1" stop-color="#3ddbd9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#6b7c93"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".025"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="700" rx="26" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="697" rx="25" fill="none" stroke="#ffffff" stroke-opacity=".07"/>

  <text x="54" y="58" fill="#f2f7ff" font-family="Inter, sans-serif" font-size="22" font-weight="700">Meme Hunter · system architecture</text>
  <text x="54" y="84" fill="#7f8da2" font-family="Inter, sans-serif" font-size="12">one data core · two outputs · no live trading without evidence</text>

  <!-- columns -->
  <g font-family="Inter, sans-serif">
    <text x="54" y="128" fill="#6f8097" font-size="10" letter-spacing="2">01 / DATA</text>
    <text x="410" y="128" fill="#6f8097" font-size="10" letter-spacing="2">02 / VALIDATION</text>
    <text x="798" y="128" fill="#6f8097" font-size="10" letter-spacing="2">03 / EXECUTION</text>

    <!-- data boxes -->
    <g filter="url(#shadow)">
      <rect x="54" y="148" width="290" height="64" rx="12" fill="#0d1725" stroke="#22344c"/>
      <text x="74" y="174" fill="#d9e5f5" font-size="13" font-weight="600">Pump.fun ingest</text>
      <text x="74" y="194" fill="#7f8da2" font-size="10">creates · trades · migrations</text>

      <rect x="54" y="224" width="290" height="64" rx="12" fill="#0d1725" stroke="#22344c"/>
      <text x="74" y="250" fill="#d9e5f5" font-size="13" font-weight="600">1m candles</text>
      <text x="74" y="270" fill="#7f8da2" font-size="10">market rank · chart · sparkline</text>

      <rect x="54" y="300" width="290" height="64" rx="12" fill="#0d1725" stroke="#22344c"/>
      <text x="74" y="326" fill="#d9e5f5" font-size="13" font-weight="600">DEX snapshots</text>
      <text x="74" y="346" fill="#7f8da2" font-size="10">post-migration price · liquidity · volume</text>

      <rect x="54" y="376" width="290" height="64" rx="12" fill="#0d1725" stroke="#22344c"/>
      <text x="74" y="402" fill="#d9e5f5" font-size="13" font-weight="600">Security / holders / dev</text>
      <text x="74" y="422" fill="#7f8da2" font-size="10">RugCheck · holders · social · dev history</text>

      <rect x="54" y="452" width="290" height="64" rx="12" fill="#0d1725" stroke="#22344c"/>
      <text x="74" y="478" fill="#d9e5f5" font-size="13" font-weight="600">Wallet profiles</text>
      <text x="74" y="498" fill="#7f8da2" font-size="10">OOS win rate · copyability · typology</text>
    </g>

    <!-- validation boxes -->
    <g filter="url(#shadow)">
      <rect x="410" y="148" width="330" height="74" rx="12" fill="#0d1725" stroke="#2b3f5c"/>
      <text x="432" y="176" fill="#d9e5f5" font-size="13" font-weight="600">Feature engine</text>
      <text x="432" y="196" fill="#7f8da2" font-size="10">age · growth · demand · momentum · creator</text>

      <rect x="410" y="240" width="330" height="74" rx="12" fill="#0d1725" stroke="#2b3f5c"/>
      <text x="432" y="268" fill="#d9e5f5" font-size="13" font-weight="600">Experiments</text>
      <text x="432" y="288" fill="#7f8da2" font-size="10">v1 / v2 / crash / size / exits</text>

      <rect x="410" y="332" width="330" height="74" rx="12" fill="#0d1725" stroke="#2b3f5c"/>
      <text x="432" y="360" fill="#d9e5f5" font-size="13" font-weight="600">Walk-forward validation</text>
      <text x="432" y="380" fill="#7f8da2" font-size="10">OOS · bootstrap · cost · latency · FDR</text>

      <rect x="410" y="424" width="330" height="74" rx="12" fill="#0d1725" stroke="#2b3f5c"/>
      <text x="432" y="452" fill="#d9e5f5" font-size="13" font-weight="600">Forward shadow</text>
      <text x="432" y="472" fill="#7f8da2" font-size="10">crash · wallet · confluence · DEX · equity</text>
    </g>

    <!-- execution boxes -->
    <g filter="url(#shadow)">
      <rect x="798" y="148" width="330" height="74" rx="12" fill="#0d1725" stroke="#3a3550"/>
      <text x="820" y="176" fill="#d9e5f5" font-size="13" font-weight="600">Risk engine</text>
      <text x="820" y="196" fill="#7f8da2" font-size="10">size · max positions · HALT · drawdown</text>

      <rect x="798" y="240" width="330" height="74" rx="12" fill="#0d1725" stroke="#3a3550"/>
      <text x="820" y="268" fill="#d9e5f5" font-size="13" font-weight="600">Live gate</text>
      <text x="820" y="288" fill="#7f8da2" font-size="10">OOS + crash OOS + ALLOW_LIVE + reconcile</text>

      <rect x="798" y="332" width="330" height="74" rx="12" fill="#0d1725" stroke="#3a3550"/>
      <text x="820" y="360" fill="#d9e5f5" font-size="13" font-weight="600">Signer / venue router</text>
      <text x="820" y="380" fill="#7f8da2" font-size="10">PumpVenue · JupiterVenue · dry-run</text>

      <rect x="798" y="424" width="330" height="74" rx="12" fill="#0d1725" stroke="#3a3550"/>
      <text x="820" y="452" fill="#d9e5f5" font-size="13" font-weight="600">Actual fill + reconcile</text>
      <text x="820" y="472" fill="#7f8da2" font-size="10">tx meta balance delta · chain vs ledger</text>
    </g>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#6b7c93" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M344 180H398"/>
    <path d="M344 256H398"/>
    <path d="M344 332H398"/>
    <path d="M344 408H398"/>
    <path d="M344 484H398"/>
    <path d="M740 185H786"/>
    <path d="M740 277H786"/>
    <path d="M740 369H786"/>
    <path d="M740 461H786"/>
  </g>

  <!-- bottom storage -->
  <g font-family="Inter, sans-serif">
    <rect x="54" y="568" width="1074" height="76" rx="14" fill="#0a1320" stroke="#1e3148"/>
    <text x="76" y="596" fill="#8c9cb3" font-size="10" letter-spacing="2">LOCAL STORAGE</text>
    <text x="76" y="620" fill="#d9e5f5" font-size="13">SQLite · WAL · positions.db · orders.db · signals.db · independent shadow DBs</text>
    <text x="890" y="620" fill="#3ddbd9" font-size="11" text-anchor="end" font-family="ui-monospace, monospace">NO CUSTODY</text>
  </g>

  <text x="1146" y="676" fill="#5e6c80" font-size="10" text-anchor="end" font-family="ui-monospace, monospace">docs/assets/architecture.svg</text>
</svg>
